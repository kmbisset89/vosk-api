name: Android Maven Central

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without a leading v, for example 0.3.75"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-maven-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      abis: ${{ steps.plan.outputs.abis }}
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - id: plan
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'abis=["arm64-v8a"]' >> "$GITHUB_OUTPUT"
            echo "version=0.3.75" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo 'abis=["armeabi-v7a","arm64-v8a","x86_64","x86"]' >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              version="${{ inputs.version }}"
            else
              version="${GITHUB_REF_NAME#v}"
            fi
            if [ -z "$version" ]; then
              echo "A release version is required." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  native:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.prepare.outputs.abis) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install NDK and host build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake autoconf automake libtool pkg-config python3 unzip zlib1g-dev

      - name: Build libvosk.so
        working-directory: android/lib
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
          VOSK_ANDROID_ABIS: ${{ matrix.abi }}
        run: bash ./build-vosk.sh

      - name: Stage libvosk.so
        run: |
          set -euo pipefail
          mkdir -p "android/lib/build/jni-upload/${{ matrix.abi }}"
          cp "android/lib/src/main/jniLibs/${{ matrix.abi }}/libvosk.so" "android/lib/build/jni-upload/${{ matrix.abi }}/libvosk.so"

      - name: Upload libvosk.so
        uses: actions/upload-artifact@v4
        with:
          name: libvosk-${{ matrix.abi }}
          path: android/lib/build/jni-upload
          if-no-files-found: error

  publish:
    needs: [prepare, native]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libvosk-*
          path: android/lib/src/main/jniLibs
          merge-multiple: true

      - name: Assemble
        working-directory: android
        run: ./gradlew :lib:assembleRelease :model-en:assembleRelease --no-daemon --stacktrace -PVERSION_NAME="${{ needs.prepare.outputs.version }}"

      - name: Publish to Maven Central
        if: needs.prepare.outputs.publish == 'true'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew :lib:publishAndReleaseToMavenCentral :model-en:publishAndReleaseToMavenCentral --no-daemon --stacktrace -PVERSION_NAME="${{ needs.prepare.outputs.version }}"
