buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.vanniktech:gradle-maven-publish-plugin:0.34.0'
    }
}

allprojects {
    version = findProperty('VERSION_NAME') ?: '0.3.75'
}

subprojects {

    apply plugin: 'com.android.library'
    apply plugin: 'com.vanniktech.maven.publish'

    repositories {
        google()
        mavenCentral()
    }

    mavenPublishing {
        publishToMavenCentral()
        signAllPublications()
    }

    mavenPublishing {
        pom {
            url = 'https://github.com/kmbisset89/vosk-api'
            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                }
            }
            developers {
                developer {
                    id = 'kmbisset89'
                    name = 'kmbisset89'
                    email = '42785343+kmbisset89@users.noreply.github.com'
                }
            }
            scm {
                connection = 'scm:git:git://github.com/kmbisset89/vosk-api.git'
                developerConnection = 'scm:git:ssh://git@github.com/kmbisset89/vosk-api.git'
                url = 'https://github.com/kmbisset89/vosk-api'
            }
        }
    }
}
