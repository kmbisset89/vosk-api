def archiveName = "vosk-android"
def pomName = "Vosk Android"
def pomDescription = "Vosk speech recognition library for Android"

android {
    namespace 'org.vosk'
    compileSdkVersion 36
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 10
        versionName = version
        archivesBaseName = archiveName
        ndkVersion = "28.2.13676358"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

tasks.register('buildVosk', Exec) {
    commandLine './build-vosk.sh'
    // Resolved at execution so configuring the project does not require an NDK
    // when libvosk.so is already built.
    doFirst {
        def ndkHome = System.getenv('ANDROID_NDK_HOME')
        if (!ndkHome) {
            ndkHome = android.ndkDirectory.absolutePath
        }
        environment 'ANDROID_NDK_HOME', ndkHome
    }
}

dependencies {
    api('net.java.dev.jna:jna:5.18.1') {
        artifact {
            type = 'aar'
            extension = 'aar'
        }
    }
}

//preBuild.dependsOn buildVosk

mavenPublishing {
    coordinates("io.github.kmbisset", archiveName, version)
    pom {
        name = pomName
        description = pomDescription
    }
}
